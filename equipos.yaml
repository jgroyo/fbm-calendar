# Configuración de calendarios FBM
# ---------------------------------
# Para añadir un equipo nuevo, copia un bloque dentro de "equipos".
#
# Campos de cada equipo:
#   id            Identificador corto y único. Será el nombre del fichero .ics
#                 (p.ej. "alevin-masc" -> alevin-masc.ics). Usa solo letras,
#                 números y guiones.
#   nombre        Nombre visible en el calendario y en la página de índice.
#   club          Clave de un club definido en la sección "clubes" de abajo.
#   categoria     Prefijo de la categoría tal y como aparece en la web de la FBM,
#                 sin distinguir mayúsculas ni acentos. Debe ser lo bastante
#                 específico para no colar otras categorías.
#                 Ejemplos: "cadete fem. 1", "alv mas 1", "infantil masc. 2".
#   equipo_contiene  (opcional) Si el club tiene VARIOS equipos en esa categoría
#                 (p.ej. VERDE y NEGRO), palabra que identifica al equipo
#                 concreto. Déjalo vacío o quítalo si solo hay uno.

# Clubes: cada uno con su ID numérico en la web de la FBM.
# El ID se saca de la URL de la página del club:
#   https://www.fbm.es/resultados-club-<ID>/<slug>
clubes:
  patrocinio-san-jose:
    id: 6341
    slug: patrocinio-san-jose-cb
    nombre: Patrocinio San José C.B.
    # Texto con el que aparece el club en la web de la FBM (sin acentos ni
    # mayúsculas importa). Se usa para quedarse solo con SUS partidos dentro
    # del grupo. Si el club tiene equipos con sufijo de color, NO lo incluyas
    # aquí (el color va en cada equipo con "equipo_contiene").
    nombre_fbm: "PATROCINIO SAN JOSE"

# Equipos a seguir. Cada uno genera su propio fichero .ics.

